# docker-compose.prod.yml
x-service-template: &catalog-service
  networks:
    - luis
  restart: always
  mem_limit: 1g
  cpus: 1.5
  mem_reservation: 300m

services:
  sysintegra-services:
    <<: *catalog-service
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}

  leatsac-services:
    <<: *catalog-service
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}

  importmuneli-services:
    <<: *catalog-service
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}

networks:
  luis:
    external: true