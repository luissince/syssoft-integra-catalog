name: SysSoftIntegra Catalog Deploy

on:
  push:
    branches:
      - test
      - master
      - preview

  workflow_dispatch:

jobs:

  # ============================================================
  # PREPARE
  # ============================================================

  prepare:
    name: Prepare deployment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.config.outputs.environment }}
      repository: ${{ steps.config.outputs.repository }}
      clients: ${{ steps.config.outputs.clients }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v3


      # --------------------------------------------------------
      # READ CONFIGURATION
      # --------------------------------------------------------

      - name: Read deployment configuration
        shell: bash
        run: |

          echo "🔎 Reading deployment configuration..."

          CONFIG="deploy/config.yml"

          if [ ! -f "$CONFIG" ]; then
            echo "❌ Configuration file not found: $CONFIG"
            exit 1
          fi


      # --------------------------------------------------------
      # DETERMINE ENVIRONMENT FROM BRANCH
      # --------------------------------------------------------

      - name: Determine environment
        id: environment
        shell: bash
        run: |

          BRANCH="${GITHUB_REF_NAME}"

          echo "Branch: $BRANCH"


          case "$BRANCH" in

            test)
              ENVIRONMENT="test"
              ;;

            preview)
              ENVIRONMENT="preview"
              ;;

            master)
              ENVIRONMENT="production"
              ;;

            *)
              echo "❌ Unsupported branch: $BRANCH"
              exit 1
              ;;

          esac


          echo "Environment: $ENVIRONMENT"

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # INSTALL YQ
      # --------------------------------------------------------

      - name: Install yq
        shell: bash
        run: |

          sudo wget -q \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq


      # --------------------------------------------------------
      # LOAD CONFIGURATION
      # --------------------------------------------------------

      - name: Load deployment configuration
        id: config
        shell: bash
        run: |

          ENVIRONMENT="${{ steps.environment.outputs.environment }}"
          CONFIG="deploy/config.yml"

          echo "Environment: $ENVIRONMENT"


          # ----------------------------------------------------
          # GET ECR REPOSITORY
          # ----------------------------------------------------

          # REPOSITORY=$(yq -r ".repositories.${ENVIRONMENT}" "$CONFIG")
          REPOSITORY=$(yq -r ".repositories" "$CONFIG")


          if [ "$REPOSITORY" = "null" ] || [ -z "$REPOSITORY" ]; then
            echo "❌ Repository not configured for $ENVIRONMENT"
            exit 1
          fi


          # ----------------------------------------------------
          # GET CLIENTS
          # ----------------------------------------------------

          CLIENTS=$(yq -r \
            ".clients | to_entries | map(select(.value.deploy == \"${ENVIRONMENT}\")) | map(.key) | @json" \
            "$CONFIG")


          if [ "$CLIENTS" = "[]" ]; then
            echo "❌ No clients configured for $ENVIRONMENT"
            exit 1
          fi


          echo "Repository: $REPOSITORY"
          echo "Clients: $CLIENTS"


          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "clients=$CLIENTS" >> "$GITHUB_OUTPUT"

  # ============================================================
  # BUILD AND PUSH
  # ============================================================

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    needs: prepare

    strategy:
      matrix:
        client: ${{ fromJSON(needs.prepare.outputs.clients) }}

    environment: ${{ matrix.client }}

    env:
      REPOSITORY: ${{ needs.prepare.outputs.repository }}
      ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      CLIENT: ${{ matrix.client }}

      APP_VERSION: "1.0.${{ github.run_number }}"
      APP_COMMIT: "${{ github.sha }}"

      IMAGE_TAG: "${{ needs.prepare.outputs.environment }}-${{ matrix.client }}-latest"
      ECR_IMAGE_URI: "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ needs.prepare.outputs.repository }}:${{ needs.prepare.outputs.environment }}-${{ matrix.client }}-latest"

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v3


      # --------------------------------------------------------
      # INSTALL YQ
      # --------------------------------------------------------

      - name: Install yq
        shell: bash
        run: |

          sudo wget -q \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq


      # --------------------------------------------------------
      # GET SERVICE
      # --------------------------------------------------------

      - name: Get Docker service
        id: service
        shell: bash
        run: |

          SERVICE=$(yq -r \
            ".clients.${{ matrix.client }}.service" \
            deploy/config.yml)


          if [ "$SERVICE" = "null" ] || [ -z "$SERVICE" ]; then
            echo "❌ Docker service not configured"
            exit 1
          fi


          echo "Client: ${{ matrix.client }}"
          echo "Service: $SERVICE"


          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # CREATE ENV
      # --------------------------------------------------------

      - name: Create .env file
        run: |

          cat > .env <<EOL

          APP_BACK_END="${{ secrets.APP_BACK_END }}"
          NEXT_PUBLIC_APP_BACK_END="${{ secrets.NEXT_PUBLIC_APP_BACK_END }}"
          AUTH_ENABLED="${{ secrets.AUTH_ENABLED }}"
          NEXT_PUBLIC_ENV="${{ secrets.NEXT_PUBLIC_ENV }}"
          NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
          NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}"
          
          NEXT_PUBLIC_APP_VERSION="${APP_VERSION}"
          NEXT_PUBLIC_APP_COMMIT="${APP_COMMIT}"

          EOL


      # --------------------------------------------------------
      # BUILD
      # --------------------------------------------------------

      - name: Build Docker image
        run: |

          docker compose \
            -f docker-compose.build.yml \
            build ${{ steps.service.outputs.service }}


      # --------------------------------------------------------
      # AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ secrets.AWS_REGION }}


      # --------------------------------------------------------
      # ECR LOGIN
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1


      # --------------------------------------------------------
      # TAG
      # --------------------------------------------------------

      - name: Tag catalog image
        run: |

          docker tag \
            ${{ matrix.client }}-catalog \
            $ECR_IMAGE_URI


      # --------------------------------------------------------
      # PUSH
      # --------------------------------------------------------

      - name: Push catalog image to ECR
        run: |

          docker push $ECR_IMAGE_URI